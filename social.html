<div class="case-modal" id="caseModal" aria-hidden="true">
  <div class="case-overlay" data-close="true"></div>
  <article class="case-card" role="dialog" aria-modal="true" aria-labelledby="caseTitle">
    <header class="case-header">
      <button class="case-close" type="button" aria-label="Close case study">×</button>
      <div>
        <p class="case-kicker" id="caseKicker">Case Study</p>
        <h2 id="caseTitle"></h2>
      </div>
    </header>

    <div class="case-scroll">
      <figure class="case-media">
        <img id="caseImage" src="" alt="">
      </figure>
      <div class="case-copy">
        <p id="caseBody"></p>
      </div>
    </div>

    <footer class="case-actions">
      <button class="case-prev" type="button">Previous</button>
      <p id="caseCount"></p>
      <button class="case-next" type="button">Next</button>
    </footer>
  </article>
</div>

<script>
  const caseStudies = [
    {
      title: "MWMO Client Project",
      body: "For the Mississippi Watershed Management Organization client project, the primary objective was to design easy-to-use, pre-made social media newsletter templates that aligned with strict brand guidelines. The client emphasized a hyper-minimalist aesthetic, prioritizing bold colors, high readability, and accessibility through limited text and minimal visual clutter.A key challenge involved navigating an evolving creative direction. While the client encouraged adherence to minimal design examples, they also requested originality, creating tension between innovation and constraint. The final templates balanced clarity, accessibility, and brand consistency. This case highlights the importance of flexibility, strong communication, and aligning design strategy with both client expectations and effective digital content practices."
    },
    {
      title: "Johnny Pops Event",
      body: "I designed this social media post for Johnny Pops, an organic popsicle company based in Plymouth, Minnesota, to promote their family-friendly event, Pops in the Park. The design showcases a playful park scene featuring a family enjoying time together, reinforcing the welcoming, community-focused feel of the event. Johnny Pops’ brand is bright, colorful, and fun, so I reflected that energy while keeping the layout clean and easy to read. The event includes live music, games, and of course Johnny Pops, making it important to appeal to both kids and parents.I incorporated a popsicle illustration into the park setting, with key details like the date and time placed inside the popsicle itself to keep the design both functional and visually engaging. Overall, the post balances fun, clarity, and strong brand consistency."
    },
    {
      title: "Games & Puzzles Shelf",
      body: "I created a social media post for the University of St. Thomas Office of Sustainability to promote the Games & Puzzles Shelf, a resource that allows students, staff, and faculty to rent board games and puzzles as a sustainable alternative to buying new. The goal of the post was to clearly explain the program while making it feel fun, inviting, and accessible. I developed a bold, playful visual style inspired by classic games, using bright colors, dice, and a game board to immediately communicate the concept. In addition to designing the post itself, I also created the Games & Puzzles Shelf logo and watermark featured in the graphic, ensuring the initiative had a recognizable visual identity that could be reused across platforms. The final design balances sustainability messaging with a lighthearted tone, helping position the Puzzle Shelf as both an environmentally conscious and enjoyable campus resource."
    },
    {
      title: "UST Halloween Post",
      body: "I created a social media post for UST Dining Services to celebrate Halloween, featuring the university’s mascot, Tommie, styled with playful seasonal elements. For this design, I dressed Tommie in a witch’s hat and added a trick‑or‑treating basket to reinforce the Halloween theme in a fun, approachable way. I chose a drippy typeface to introduce a light “horror” feel while keeping the overall tone friendly and school‑appropriate. The post was designed to be eye‑catching and adaptable, and it ultimately evolved into a reusable template for other holidays throughout the year. This system has since been applied to virtually eceryother holiday such as Christmas, Earth Day, and Valentine’s Day. Only a few elements change each time, including the holiday‑specific font, the hat or accessory Tommie wears, and the side element, such as a Christmas tree or a box of chocolates. This approach ensured brand consistency while allowing for seasonal creativity."
    },
   
     {
      title: "O’Shaughnessy Poetry Award Ceremony",
      body: "I designed a social media event post for the Center for Irish Studies at the University of St. Thomas to celebrate the annual O’Shaughnessy Poetry Award. Each year, the center selects a recipient, and this year’s winner was honored at Trinity College Dublin. The post was created to promote the event and highlight the significance of the award while maintaining a strong visual connection to Irish culture and literature. I incorporated architectural elements inspired by Trinity College to ground the design in its historic setting, pairing them with an image of the award recipient, Enda Wyley, to personalize the announcement. The combination of classical architecture and portrait photography helped balance tradition with approachability, making the post both informative and visually engaging. The final design effectively celebrated the recipient, the venue, and the prestige of the award in a way that felt thoughtful and culturally relevant."
    },
 {
      title: "Author Interview",
      body: "I created this social media post while interning for the City of Edina Parks and Recreation Department to promote an author interview and book event. The post was designed to highlight the featured author and generate interest in the event while remaining clear and informative for a broad community audience. I combined the book cover with a large author photo to create a strong visual hierarchy and immediately communicate the focus of the event. The clean layout allowed the key details to be easy to read while still feeling polished and engaging. I used neutral tones paired with bold typography to keep the design professional and accessible, aligning with the city’s branding while still feeling inviting. This project helped me practice balancing promotional clarity with visual storytelling and gave me experience designing for community‑focused events in a public sector setting."
    },
    {
      title: "Bridging Brighter Futures",
      body: "In my Strategic Communication capstone course, I collaborated on a campaign for a local elementary school’s enrichment cluster program, which relies on volunteers to lead specialized clubs such as art, chess, and journalism. Our campaign theme, “Bridging Brighter Futures,” centered on connection and opportunity, using bridge imagery to symbolize support between the community and students. I incorporated this visual theme into a social media post, helped design a cohesive logo, and wrote the copy to align with the campaign’s messaging. The post was designed as a flexible template, allowing the placeholder image to be easily replaced with real photos from the school, making the content more authentic and adaptable over time. The campaign aimed to raise awareness and recruit volunteers by highlighting the program’s impact and accessibility. This project strengthened my ability to integrate strategy, design, and copywriting to create engaging, community-focused content."
    },
    
    {
      title: "Dining Services March Madness",
      body: "During my internship at Dining Services, I developed a March Madness–style bracket campaign tailored for Instagram and Facebook Stories to boost student engagement. The concept invited students to vote daily on their favorite dining locations on campus, creating a sense of friendly competition and anticipation over the course of a week. Each round narrowed the choices until a final winner emerged, with participation driven through interactive story features like polls and countdowns. The campaign was designed to make campus dining more engaging and relatable while encouraging consistent interaction with our social media platforms. It successfully generated high levels of engagement, with students returning each day to see results and cast new votes. This project highlighted my ability to combine creativity with strategy, using timely themes and interactive tools to connect with a student audience. It also reinforced my interest in developing content that is not only informative but genuinely enjoyable and community-driven."

    },
    
    {
      title: "Irish Studies Minor",
      body: "During my internship with the Center for Irish Studies, I created a social media graphic designed to promote the Irish Studies minor in an engaging, student-friendly way. The concept mimicked a smartphone lock screen notification, allowing the message to feel familiar and attention-grabbing for a college audience. I wrote the copy to be conversational and direct, encouraging students to consider the program. One of the most challenging aspects of this project was aligning the background image with the phone frame to ensure the composition looked seamless and realistic. Careful attention to scale, positioning, and visual balance was essential to make the design feel polished and cohesive. The final graphic successfully combined strong visuals with clear messaging, resulting in an eye-catching post that blended creativity with strategic communication goals. This project strengthened my design precision and reinforced the importance of detail when creating visually compelling digital content."
    }
  ];

  const modal = document.getElementById("caseModal");
  const title = document.getElementById("caseTitle");
  const body = document.getElementById("caseBody");
  const image = document.getElementById("caseImage");
  const count = document.getElementById("caseCount");
  let activeCase = 0;
  let activePost = null;

  function renderCase(index) {
    activeCase = (index + caseStudies.length) % caseStudies.length;
    const item = caseStudies[activeCase];
    activePost = document.querySelector(`.insta-post[data-case="${activeCase}"]`);
    const postImage = activePost?.querySelector("img");
    title.textContent = item.title;
    body.textContent = item.body;
    image.src = postImage?.getAttribute("src") || "";
    image.alt = postImage?.getAttribute("alt") || item.title;
    count.textContent = `${activeCase + 1} / ${caseStudies.length}`;
  }

  function openCase(index) {
    renderCase(index);
    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-open");
  }

  function closeCase() {
    modal.classList.remove("is-open");
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");
  }

  document.querySelectorAll(".insta-post").forEach((post) => {
    post.addEventListener("click", () => openCase(Number(post.dataset.case)));
  });

  document.querySelector(".case-close").addEventListener("click", closeCase);
  document.querySelector(".case-overlay").addEventListener("click", closeCase);
  document.querySelector(".case-prev").addEventListener("click", () => renderCase(activeCase - 1));
  document.querySelector(".case-next").addEventListener("click", () => renderCase(activeCase + 1));

  document.addEventListener("keydown", (event) => {
    if (!modal.classList.contains("is-open")) return;
    if (event.key === "Escape") closeCase();
    if (event.key === "ArrowLeft") renderCase(activeCase - 1);
    if (event.key === "ArrowRight") renderCase(activeCase + 1);
  });
</script>

</body>
</html>
